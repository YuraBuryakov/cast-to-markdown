name: build

on:
  push:
  pull_request:

jobs:
  verify:
    name: mvn verify (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: file handling and line endings differ, and the project is developed there
        os: [ ubuntu-latest, windows-latest ]
        # 17 is the minimum the library supports, 21 the current LTS
        java: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # the release profile also builds the Javadoc and sources jars; signing is skipped
      - run: mvn -B -ntp -Prelease -Dgpg.skip verify
